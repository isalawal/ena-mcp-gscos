<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENA MCP Server</title>
<style>
body { font-family: sans-serif; background: #0f1117; color: #d4d4d4; padding: 20px; }
h1 { color: #4a90d9; margin-bottom: 8px; }
p { color: #888; font-size: 13px; margin-bottom: 20px; }
.tip { background: #1a2a1a; border: 1px solid #2ecc71; border-radius: 6px; padding: 12px; margin-bottom: 20px; font-size: 12px; color: #7dbb7d; }
.tip a { color: #2ecc71; }
label { display: block; color: #aaa; font-size: 12px; margin-bottom: 6px; margin-top: 14px; }
input, textarea { width: 100%; padding: 12px; background: #1e1e2e; border: 1px solid #444; border-radius: 6px; color: #d4d4d4; font-size: 14px; }
textarea { height: 80px; }
button { display: block; width: 100%; padding: 12px; background: #4a90d9; border: none; border-radius: 6px; color: white; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 12px; }
button:disabled { background: #333; cursor: not-allowed; }
#output { margin-top: 20px; background: #1e1e2e; border: 1px solid #333; border-radius: 8px; padding: 16px; display: none; }
.tool { color: #9b59b6; font-size: 12px; margin-bottom: 4px; }
.ok { color: #2ecc71; font-size: 12px; margin-bottom: 4px; }
.answer { color: #d4d4d4; font-size: 14px; line-height: 1.7; margin-top: 12px; white-space: pre-wrap; }
.error { color: #e74c3c; font-size: 13px; }
</style>
</head>
<body>

<h1>ENA MCP Server — Live Demo</h1>
<p>Ask Gemini anything about genomic data. It queries real ENA data through MCP tools — no hallucinations.</p>

<div class="tip">
  Need a free Gemini API key? Get one in 2 minutes at
  <a href="https://aistudio.google.com" target="_blank">aistudio.google.com</a>
  — no credit card required.
</div>

<label>Gemini API Key</label>
<input type="password" id="key" placeholder="Paste your free Gemini API key here">

<label>Your question</label>
<textarea id="q">How many human sequencing runs are in ENA?</textarea>

<button id="btn" onclick="ask()">Ask Gemini</button>

<div id="output">
  <div id="steps"></div>
  <div class="answer" id="answer"></div>
</div>

<script>
const BASE = "https://www.ebi.ac.uk/ena/portal/api";

async function callTool(name, args) {
  try {
    if (name === "search_ena") {
      const r = await fetch(BASE + "/search?result=" + (args.result_type||"sample") + "&query=" + encodeURIComponent(args.query) + "&limit=" + (args.limit||5) + "&format=json&dataPortal=ena");
      return await r.json();
    }
    if (name === "count_ena") {
      const r = await fetch(BASE + "/count?result=" + (args.result_type||"read_run") + "&query=" + encodeURIComponent(args.query) + "&dataPortal=ena");
      const t = await r.text();
      const n = parseInt(t.trim().split("\n").pop());
      return {count: n, formatted: n.toLocaleString()};
    }
    if (name === "get_result_types") {
      const r = await fetch(BASE + "/results?dataPortal=ena&format=json");
      return await r.json();
    }
    if (name === "get_searchable_fields") {
      const r = await fetch(BASE + "/searchFields?result=" + (args.result_type||"sample") + "&dataPortal=ena&format=json");
      return await r.json();
    }
  } catch(e) { return {error: e.message}; }
  return {error: "unknown tool"};
}

async function ask() {
  const key = document.getElementById("key").value.trim();
  const q = document.getElementById("q").value.trim();
  if (!key) { alert("Please paste your Gemini API key"); return; }
  if (!q) { alert("Please enter a question"); return; }

  const btn = document.getElementById("btn");
  const out = document.getElementById("output");
  const steps = document.getElementById("steps");
  const answer = document.getElementById("answer");

  btn.disabled = true;
  btn.textContent = "Gemini is thinking...";
  out.style.display = "block";
  steps.innerHTML = "";
  answer.textContent = "";

  const tools = [{functionDeclarations: [
    {name:"search_ena", description:"Search ENA for real genomic records like samples, studies, sequencing runs.", parameters:{type:"OBJECT", properties:{query:{type:"STRING", description:"ENA query e.g. tax_eq(9606) for human"}, result_type:{type:"STRING", description:"sample, read_run, or study"}, limit:{type:"INTEGER", description:"number of results"}}, required:["query"]}},
    {name:"count_ena", description:"Count how many records in ENA match a query.", parameters:{type:"OBJECT", properties:{query:{type:"STRING", description:"ENA query string"}, result_type:{type:"STRING", description:"sample, read_run, or study"}}, required:["query"]}},
    {name:"get_result_types", description:"Get all available data types in ENA.", parameters:{type:"OBJECT", properties:{placeholder:{type:"STRING"}}}},
    {name:"get_searchable_fields", description:"Get all fields that can be searched for a given ENA result type.", parameters:{type:"OBJECT", properties:{result_type:{type:"STRING", description:"sample, read_run, or study"}}}}
  ]}];

  const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + key;
  const contents = [{role:"user", parts:[{text:q}]}];

  try {
    for (let i = 0; i < 6; i++) {
      const res = await fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({contents, tools})
      });
      const data = await res.json();

      if (data.error) {
        answer.innerHTML = '<span class="error">Error: ' + data.error.message + '</span>';
        break;
      }

      const parts = data.candidates[0].content.parts;
      const calls = parts.filter(p => p.functionCall);

      if (!calls.length) {
        answer.textContent = parts.map(p => p.text||"").join("");
        break;
      }

      contents.push({role:"model", parts});
      const results = [];

      for (const p of calls) {
        const {name, args} = p.functionCall;
        steps.innerHTML += '<div class="tool">→ calling ' + name + '(' + JSON.stringify(args||{}) + ')</div>';
        const result = await callTool(name, args||{});
        steps.innerHTML += '<div class="ok">✓ ENA returned real data</div>';
        results.push({functionResponse:{name, response:{result:JSON.stringify(result)}}});
      }

      contents.push({role:"user", parts:results});
    }
  } catch(e) {
    answer.innerHTML = '<span class="error">Error: ' + e.message + '</span>';
  }

  btn.disabled = false;
  btn.textContent = "Ask Gemini";
}
</script>
</body>
</html>

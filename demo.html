<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENA MCP Server</title>
<style>
body { font-family: sans-serif; background: #0f1117; color: #d4d4d4; padding: 20px; }
h1 { color: #4a90d9; margin-bottom: 8px; }
p { color: #888; font-size: 13px; margin-bottom: 20px; }
textarea { width: 100%; padding: 12px; background: #1e1e2e; border: 1px solid #444; border-radius: 6px; color: #d4d4d4; font-size: 14px; height: 80px; }
button { display: block; width: 100%; padding: 12px; background: #4a90d9; border: none; border-radius: 6px; color: white; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 12px; }
#output { margin-top: 20px; background: #1e1e2e; border: 1px solid #333; border-radius: 8px; padding: 16px; display: none; white-space: pre-wrap; font-size: 13px; line-height: 1.7; }
.tool { color: #9b59b6; font-size: 12px; margin-bottom: 4px; }
.answer { color: #d4d4d4; margin-top: 12px; }
.error { color: #e74c3c; }
</style>
</head>
<body>
<h1>ENA MCP Server</h1>
<p>Ask Gemini anything about genomic data. It queries real ENA data through MCP tools.</p>

<textarea id="q">How many human sequencing runs are in ENA?</textarea>
<button onclick="ask()">Ask Gemini</button>
<div id="output"></div>

<script>
const KEY = "AIzaSyAgzD1K_OW2JZiYiyJgcczXAAhVPdQmiuo";
const BASE = "https://www.ebi.ac.uk/ena/portal/api";

async function callTool(name, args) {
  try {
    if (name === "search_ena") {
      const r = await fetch(BASE + "/search?result=" + (args.result_type||"sample") + "&query=" + encodeURIComponent(args.query) + "&limit=" + (args.limit||5) + "&format=json&dataPortal=ena");
      return await r.json();
    }
    if (name === "count_ena") {
      const r = await fetch(BASE + "/count?result=" + (args.result_type||"read_run") + "&query=" + encodeURIComponent(args.query) + "&dataPortal=ena");
      const t = await r.text();
      const n = parseInt(t.trim().split("\n").pop());
      return {count: n, formatted: n.toLocaleString()};
    }
    if (name === "get_result_types") {
      const r = await fetch(BASE + "/results?dataPortal=ena&format=json");
      return await r.json();
    }
    if (name === "get_searchable_fields") {
      const r = await fetch(BASE + "/searchFields?result=" + (args.result_type||"sample") + "&dataPortal=ena&format=json");
      return await r.json();
    }
  } catch(e) { return {error: e.message}; }
  return {error: "unknown tool"};
}

async function ask() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const out = document.getElementById("output");
  out.style.display = "block";
  out.innerHTML = "Thinking...";

  const tools = [{functionDeclarations: [
    {name:"search_ena", description:"Search ENA for genomic records.", parameters:{type:"OBJECT", properties:{query:{type:"STRING"}, result_type:{type:"STRING"}, limit:{type:"INTEGER"}}, required:["query"]}},
    {name:"count_ena", description:"Count ENA records matching a query.", parameters:{type:"OBJECT", properties:{query:{type:"STRING"}, result_type:{type:"STRING"}}, required:["query"]}},
    {name:"get_result_types", description:"Get all data types in ENA.", parameters:{type:"OBJECT", properties:{placeholder:{type:"STRING"}}}},
    {name:"get_searchable_fields", description:"Get searchable fields for a result type.", parameters:{type:"OBJECT", properties:{result_type:{type:"STRING"}}}}
  ]}];

  const contents = [{role:"user", parts:[{text:q}]}];
  const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + KEY;
  let html = "";

  try {
    for (let i = 0; i < 5; i++) {
      const res = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({contents, tools})});
      const data = await res.json();

      if (data.error) {
        out.innerHTML = '<span class="error">Error: ' + data.error.message + '</span>';
        return;
      }

      const parts = data.candidates[0].content.parts;
      const calls = parts.filter(p => p.functionCall);

      if (!calls.length) {
        const text = parts.map(p => p.text||"").join("");
        out.innerHTML = html + '<div class="answer">' + text + '</div>';
        return;
      }

      contents.push({role:"model", parts});
      const results = [];

      for (const p of calls) {
        const {name, args} = p.functionCall;
        html += '<div class="tool">→ calling ' + name + '(' + JSON.stringify(args) + ')</div>';
        out.innerHTML = html + "fetching from ENA...";
        const result = await callTool(name, args||{});
        html += '<div class="tool" style="color:#2ecc71">✓ ENA returned ' + JSON.stringify(result).slice(0,80) + '...</div>';
        results.push({functionResponse:{name, response:{result:JSON.stringify(result)}}});
      }

      contents.push({role:"user", parts:results});
    }
  } catch(e) {
    out.innerHTML = '<span class="error">Error: ' + e.message + '</span>';
  }
}
</script>
</body>
</html>

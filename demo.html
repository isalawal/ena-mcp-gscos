<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENA MCP Server — Live Demo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #0f1117; color: #d4d4d4; min-height: 100vh; padding: 16px; }
.container { max-width: 800px; margin: 0 auto; }
h1 { color: #4a90d9; font-size: 22px; margin-bottom: 4px; }
p.sub { color: #888; font-size: 12px; margin-bottom: 20px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.badge { background: #1e1e2e; border: 1px solid #333; border-radius: 4px; padding: 3px 10px; font-size: 11px; color: #9b59b6; }
.badge.green { color: #2ecc71; border-color: #2ecc71; }
.badge.blue { color: #4a90d9; border-color: #4a90d9; }
label { display: block; color: #aaa; font-size: 12px; margin-bottom: 6px; margin-top: 12px; }
select, input { width: 100%; padding: 9px; background: #1e1e2e; border: 1px solid #333; border-radius: 5px; color: #d4d4d4; font-size: 13px; }
button { width: 100%; padding: 11px; background: #4a90d9; border: none; border-radius: 6px; color: white; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 14px; }
button:hover { background: #357abd; }
button:disabled { background: #333; cursor: not-allowed; }
.result { margin-top: 20px; background: #1e1e2e; border: 1px solid #2a2a4e; border-radius: 8px; padding: 16px; display: none; }
.result h3 { font-size: 11px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
.result.success h3 { color: #2ecc71; }
.result.error h3 { color: #e74c3c; }
.record { background: #0f1117; border-left: 3px solid #4a90d9; border-radius: 4px; padding: 10px; margin-bottom: 8px; }
.record .acc { color: #4a90d9; font-weight: bold; font-size: 13px; }
.record .desc { color: #aaa; font-size: 12px; margin-top: 3px; }
.count-display { font-size: 40px; font-weight: bold; color: #4a90d9; text-align: center; padding: 16px 0 6px; }
.count-label { text-align: center; color: #666; font-size: 12px; }
pre { font-size: 10.5px; color: #7dbb7d; overflow-x: auto; white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow-y: auto; }
.status-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.pill { font-size: 10px; padding: 3px 8px; border-radius: 10px; }
.pill.ok { background: #1a3a1a; color: #2ecc71; border: 1px solid #2ecc71; }
.pill.warn { background: #3a2a00; color: #f39c12; border: 1px solid #f39c12; }
</style>
</head>
<body>
<div class="container">

  <h1>ENA MCP Server — Live Demo</h1>
  <p class="sub">Query the European Nucleotide Archive in real time. Built for GSoC 2026 — EMBL-EBI.</p>

  <div class="badges">
    <span class="badge blue">7 tools</span>
    <span class="badge green">live ENA data</span>
    <span class="badge green">no hallucinations</span>
    <span class="badge">input validation</span>
    <span class="badge">caching</span>
    <span class="badge">rate limiting</span>
  </div>

  <label>Select a tool</label>
  <select id="tool" onchange="updateForm()">
    <option value="search">search_ena — find genomic records</option>
    <option value="count">count_ena — count matching records</option>
    <option value="fields">get_searchable_fields — what can I filter by?</option>
    <option value="return">get_return_fields — what data can I get back?</option>
    <option value="types">get_result_types — what data types exist?</option>
    <option value="accession">get_accession_types — what accession formats exist?</option>
    <option value="vocab">get_controlled_vocab — what are valid field values?</option>
  </select>

  <div id="query_row">
    <label>Query (ENA query string)</label>
    <input id="query" type="text" value="tax_eq(9606)" placeholder="e.g. tax_eq(9606) for human">
  </div>

  <div id="field_row" style="display:none">
    <label>Field name</label>
    <input id="field" type="text" value="instrument_platform">
  </div>

  <label>Result type</label>
  <select id="result_type">
    <option value="sample">sample</option>
    <option value="read_run">read_run</option>
    <option value="study">study</option>
    <option value="experiment">experiment</option>
    <option value="assembly">assembly</option>
  </select>

  <div id="limit_row">
    <label>Limit (max 100 results)</label>
    <input id="limit" type="number" value="5" min="1" max="100">
  </div>

  <button id="btn" onclick="runQuery()">Run Query</button>

  <div id="result" class="result"></div>

</div>

<script>
const BASE = "https://www.ebi.ac.uk/ena/portal/api";

function updateForm() {
  const tool = document.getElementById("tool").value;
  document.getElementById("query_row").style.display = ["search","count"].includes(tool) ? "block" : "none";
  document.getElementById("field_row").style.display = tool === "vocab" ? "block" : "none";
  document.getElementById("limit_row").style.display = tool === "search" ? "block" : "none";
}

async function runQuery() {
  const tool = document.getElementById("tool").value;
  const query = document.getElementById("query").value.trim();
  const result_type = document.getElementById("result_type").value;
  const limit = document.getElementById("limit").value;
  const field = document.getElementById("field").value.trim();

  const btn = document.getElementById("btn");
  const resultDiv = document.getElementById("result");

  btn.disabled = true;
  btn.textContent = "Fetching from ENA...";
  resultDiv.style.display = "block";
  resultDiv.className = "result";
  resultDiv.innerHTML = "<h3>Loading...</h3>";

  const start = Date.now();

  try {
    let url;
    if (tool === "search") url = `${BASE}/search?result=${result_type}&query=${encodeURIComponent(query)}&limit=${limit}&format=json&dataPortal=ena`;
    else if (tool === "count") url = `${BASE}/count?result=${result_type}&query=${encodeURIComponent(query)}&dataPortal=ena`;
    else if (tool === "fields") url = `${BASE}/searchFields?result=${result_type}&dataPortal=ena&format=json`;
    else if (tool === "return") url = `${BASE}/returnFields?result=${result_type}&dataPortal=ena&format=json`;
    else if (tool === "types") url = `${BASE}/results?dataPortal=ena&format=json`;
    else if (tool === "accession") url = `${BASE}/accessionTypes?dataPortal=ena&format=json`;
    else if (tool === "vocab") url = `${BASE}/controlledVocab?field=${encodeURIComponent(field)}&result=${result_type}&dataPortal=ena&format=json`;

    const response = await fetch(url);
    const text = await response.text();
    const elapsed = Date.now() - start;

    resultDiv.className = "result success";
    let html = "<h3>Result</h3>";
    html += `<div class="status-row"><span class="pill ok">status: ${response.status}</span><span class="pill ok">time: ${elapsed}ms</span><span class="pill warn">cached after first call</span></div>`;

    if (tool === "count") {
      const number = text.trim().split("\n").pop().trim();
      html += `<div class="count-display">${parseInt(number).toLocaleString()}</div>`;
      html += `<div class="count-label">records matching "${query}" in ${result_type}</div>`;
    } else {
      const data = JSON.parse(text);
      if (tool === "search" && Array.isArray(data)) {
        html += `<div style="color:#888;font-size:11px;margin:8px 0">${data.length} records returned</div>`;
        html += data.map(r => `
          <div class="record">
            <div class="acc">${r.accession || r.sample_accession || r.study_accession || Object.values(r)[0] || "N/A"}</div>
            <div class="desc">${r.description || r.study_title || r.scientific_name || Object.values(r)[1] || ""}</div>
          </div>`).join("");
      } else {
        html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
      }
    }

    resultDiv.innerHTML = html;

  } catch(e) {
    resultDiv.className = "result error";
    resultDiv.innerHTML = `<h3>Error</h3><pre>${e.message}</pre>`;
  }

  btn.disabled = false;
  btn.textContent = "Run Query";
}

updateForm();
</script>
</body>
</html>
